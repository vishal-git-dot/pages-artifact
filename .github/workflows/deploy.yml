name: Generate screenshots & deploy to GitHub Pages

# Everything the gallery needs — thumbnails, titles, categories — is
# regenerated fresh from pages/ on every run, right before deploying.
# Nothing here gets committed back to git, so there's no second
# workflow to race and nothing that can go stale between a push and
# what's live.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate screenshots & catalog data
        run: npm run generate

      - name: Remove build tooling before deploying
        # node_modules is only needed to run the generator above —
        # nothing in the deployed site should ship it.
        run: rm -rf node_modules

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
