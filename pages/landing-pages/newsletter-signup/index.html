<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Long Read — a weekly letter on slow thinking</title>
  <meta name="description" content="A minimal, editorial-style newsletter signup page with a single email field." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="letter-wrap">
    <p class="letter-kicker">A weekly letter</p>
    <h1>The Long Read</h1>
    <p class="letter-sub">
      One essay a week on slow thinking, careful work, and the ideas
      that don't fit in a headline. No spam, unsubscribe any time.
    </p>

    <form class="letter-form" id="letterForm">
      <input type="email" id="email" placeholder="you@example.com" required />
      <button type="submit">Subscribe</button>
    </form>
    <p class="letter-note" id="letterNote">Free, every Thursday morning.</p>
  </main>
</body>
</html>
