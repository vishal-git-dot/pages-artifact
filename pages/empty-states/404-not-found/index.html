<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — page not found</title>
  <meta name="description" content="A playful 404 error page with a simple CSS illustration and a way back home." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="lost-wrap">
    <div class="lost-illustration" aria-hidden="true">
      <div class="lost-planet"></div>
      <div class="lost-ring"></div>
      <div class="lost-astronaut">🧑‍🚀</div>
    </div>
    <p class="lost-code">404</p>
    <h1>Looks like you drifted off course.</h1>
    <p class="lost-sub">The page you're looking for doesn't exist, moved, or never did.</p>
    <a class="lost-home" href="#">Take me home</a>
  </main>
</body>
</html>
