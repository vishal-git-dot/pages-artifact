<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow Threads</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#07060f;--fg:#f3f0ff;--muted:#a9a3c7;--panel:rgba(14,12,30,.72);--line:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060f}}
:root[data-theme="dark"]{--bg:#07060f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,96px);overflow:hidden;
background:radial-gradient(120% 90% at 20% 30%,#17103a,var(--bg))}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.copy{position:relative;max-width:640px}
h1{font-size:clamp(2.6rem,8vw,5.6rem);line-height:.98;letter-spacing:-.03em;font-weight:800;margin:0 0 20px}
p{font-size:clamp(1rem,2.2vw,1.2rem);line-height:1.55;color:var(--muted);margin:0 0 28px;max-width:46ch}
.cta{display:inline-block;background:var(--fg);color:#120d2b;font:600 1rem inherit;font-family:inherit;padding:14px 24px;border-radius:999px;border:0;cursor:pointer}
.cta:focus-visible,.sw:focus-visible,button.tog:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.panel{position:absolute;left:clamp(16px,4vw,48px);right:clamp(16px,4vw,48px);bottom:calc(16px + env(safe-area-inset-bottom,0px));
display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);font-size:.9rem}
.panel label{display:flex;align-items:center;gap:10px;color:var(--muted)}
.sws{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:#fff}
input[type=range]{accent-color:#a78bfa;width:120px}
button.tog{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
button.tog[aria-pressed="true"]{background:var(--fg);color:#120d2b}
@media (max-width:560px){.copy{margin-bottom:120px}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="copy">
    <h1>Motion that sits behind your message.</h1>
    <p>Bundles of luminous threads drift across the frame, fanning out with distance and breathing as they go. No video file to ship.</p>
    <button class="cta" type="button">Start building</button>
  </div>
  <div class="panel" role="group" aria-label="Background settings">
    <div class="sws" role="group" aria-label="Color">
      <button class="sw" type="button" aria-label="Violet" aria-pressed="true" data-a="#7c5cff" data-b="#38d5ff" style="background:linear-gradient(135deg,#7c5cff,#38d5ff)"></button>
      <button class="sw" type="button" aria-label="Ember" aria-pressed="false" data-a="#ff5a36" data-b="#ffc45c" style="background:linear-gradient(135deg,#ff5a36,#ffc45c)"></button>
      <button class="sw" type="button" aria-label="Lagoon" aria-pressed="false" data-a="#14c8a0" data-b="#5b8cff" style="background:linear-gradient(135deg,#14c8a0,#5b8cff)"></button>
    </div>
    <label>Speed <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" aria-label="Speed"></label>
    <button class="tog" id="calm" type="button" aria-pressed="false">Calmer</button>
  </div>
</section>
<script>
(function(){
  var cv=document.getElementById('gl');
  var gl=cv.getContext('webgl',{antialias:false,alpha:true,premultipliedAlpha:true});
  if(!gl)return;
  var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs=[
  'precision mediump float;',
  'uniform vec2 uRes;uniform float uT;uniform vec3 uA;uniform vec3 uB;uniform float uCalm;',
  'void main(){',
  ' vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;',
  ' float x=uv.x;vec3 col=vec3(0.);',
  ' for(int b=0;b<3;b++){',
  '  float fb=float(b);',
  '  float baseY=(fb-1.)*.28+.05;',
  '  for(int i=0;i<14;i++){',
  '   float fi=float(i)/13.;',
  '   float fan=smoothstep(-1.1,1.1,x+.15*fb);',
  '   float spread=(fi-.5)*(.03+.55*fan*(1.-.5*uCalm));',
  '   float breathe=1.+.28*sin(uT*.6+fb*2.+fi*3.);',
  '   float amp=.22*(1.-.45*uCalm);',
  '   float y=baseY+amp*sin(x*1.6+uT*.35+fb*2.1)+.5*amp*sin(x*3.1-uT*.25+fb)+spread*breathe;',
  '   float d=abs(uv.y-y);',
  '   float g=exp(-d*260.)*.55+.0035/(d+.012);',
  '   float pulse=.65+.35*sin(uT*.8+fi*6.+fb*1.7+x*2.);',
  '   col+=mix(uA,uB,fi)*g*pulse*.16;',
  '  }',
  ' }',
  ' col*=smoothstep(1.4,.2,length(uv*vec2(.8,1.1)));',
  ' col=1.-exp(-col*1.5);',
  ' gl_FragColor=vec4(col,max(col.r,max(col.g,col.b)));',
  '}'].join('\n');
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;
  gl.useProgram(pr);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var U={};['uRes','uT','uA','uB','uCalm'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

  function hex(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];}
  var curA=hex('#7c5cff'),curB=hex('#38d5ff'),tgtA=curA.slice(),tgtB=curB.slice();
  var speed=1,calm=0,calmTgt=0,t=0,last=performance.now();
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,1.5);
    var w=Math.max(1,Math.floor(cv.clientWidth*dpr)),h=Math.max(1,Math.floor(cv.clientHeight*dpr));
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);}
  }
  function lerp3(a,b,k){for(var i=0;i<3;i++)a[i]+=(b[i]-a[i])*k;}
  function frame(now){
    var dt=Math.min((now-last)/1000,.05);last=now;
    if(!reduce)t+=dt*speed*(1-.55*calm);
    lerp3(curA,tgtA,.06);lerp3(curB,tgtB,.06);calm+=(calmTgt-calm)*.06;
    resize();
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.uRes,cv.width,cv.height);gl.uniform1f(U.uT,t+8.);
    gl.uniform3fv(U.uA,curA);gl.uniform3fv(U.uB,curB);gl.uniform1f(U.uCalm,calm);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var sws=document.querySelectorAll('.sw');
  sws.forEach(function(s){s.addEventListener('click',function(){
    sws.forEach(function(o){o.setAttribute('aria-pressed','false');});
    s.setAttribute('aria-pressed','true');tgtA=hex(s.dataset.a);tgtB=hex(s.dataset.b);
  });});
  document.getElementById('speed').addEventListener('input',function(e){speed=parseFloat(e.target.value);});
  var cb=document.getElementById('calm');
  cb.addEventListener('click',function(){
    var on=cb.getAttribute('aria-pressed')!=='true';
    cb.setAttribute('aria-pressed',on);calmTgt=on?1:0;
  });
})();
</script>
</body>
</html>
